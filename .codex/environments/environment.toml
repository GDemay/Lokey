version = 1
name = "Lokey"

[setup]
script = ""

[[actions]]
name = "Run Lokey"
icon = "run"
command = "./\"Run Lokey.command\""

[[actions]]
name = "Open in Xcode"
icon = "debug"
command = "export PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"; xcodegen generate && open Lokey.xcodeproj"

[[actions]]
name = "Run on iPhone"
icon = "run"
command = "./\"Run on iPhone.command\""

[[actions]]
name = "Install on iPhone"
icon = "run"
command = "./scripts/run-device.sh --install-only"

[[actions]]
name = "Upload to TestFlight"
icon = "run"
command = "./scripts/upload-testflight.sh"

[[actions]]
name = "TestFlight status"
icon = "debug"
command = "python3 scripts/app-store.py status"

[[actions]]
name = "App Store checks"
icon = "debug"
command = "python3 scripts/app-store.py ready"
